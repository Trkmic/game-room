<div class="resultados-main">
  <h1>Resultados de los Juegos 📊</h1>

  <div class="selector">
    <button (click)="mostrarJuego('ahorcado')">Ahorcado</button>
    <button (click)="mostrarJuego('preguntados')">Preguntados</button>
    <button (click)="mostrarJuego('fastclick')">Fast Click</button>
    <button (click)="mostrarJuego('mayormenor')">Mayor - Menor</button>
  </div>

  <div class="tabla-scroll" *ngIf="!cargando && resultados.length > 0">
        <table>
          <thead>
            <tr>
          <th>#</th>
              <th>Usuario</th>
          <th>Juego</th>
              <th>Puntaje</th>
              <th>Tiempo (s)</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody>
        <tr *ngFor="let r of resultados; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ r.email }}</td>
          <td>{{ r.juego }}</td>
              <td>{{ r.puntaje }}</td>
              <td>{{ r.tiempo_segundos }}</td>
              <td>{{ r.fecha_play | date:'short' }}</td>
            </tr>
          </tbody>
        </table>
      </div>

  <p *ngIf="!cargando && resultados.length === 0">No hay resultados aún 🫢</p>
  <p *ngIf="cargando">Cargando resultados...</p>
</div>
