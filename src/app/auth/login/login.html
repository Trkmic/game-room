<main class="main_bienvenida">
  <section class="access_section cliente">
    <h1>Iniciar Sesión</h1>

    <div class="login-container">

      <!-- Botón Quién soy -->
      <div class="login-buttons">
        <button (click)="goToQuienSoy()" class="btn-quien-soy" [disabled]="loading()">
          ¿Quién soy?
        </button>
      </div>

      <!-- Formulario de login -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Email -->
          <div class="form-group">
            <label for="email">Correo electrónico</label>
          <input id="email" type="email" [formControl]="f['email']" placeholder="Ingresa tu email" [disabled]="loading()">
            <div class="error" *ngIf="submitted && f['email'].errors">
              <small *ngIf="f['email'].errors?.['required']">El correo es obligatorio.</small>
              <small *ngIf="f['email'].errors?.['email']">Correo inválido.</small>
            </div>
          </div>

        <!-- Contraseña -->
          <div class="form-group">
            <label for="password">Contraseña</label>
          <input id="password" type="password" [formControl]="f['password']" placeholder="Ingresa tu contraseña" [disabled]="loading()">
            <div class="error" *ngIf="submitted && f['password'].errors">
              <small *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</small>
              <small *ngIf="f['password'].errors?.['minlength']">Debe tener al menos 6 caracteres.</small>
            </div>
          </div>

        <!-- Botón de login -->
        <button type="submit" class="btn-login" [disabled]="loading()">
          <ng-container *ngIf="!loading()">Iniciar Sesión</ng-container>
          <ng-container *ngIf="loading()">Cargando...</ng-container>
        </button>
        </form>

      <!-- Botón de registro -->
      <button class="btn-register" (click)="goToRegister()" [disabled]="loading()">Registrarse</button>

      <!-- Mensaje de error general -->
      <div class="error-message" *ngIf="errorMessage()">{{ errorMessage() }}</div>

      <!-- Quick login -->
      <div class="quick-login" *ngIf="quickUsers.length > 0">
        <h2>Ingresos rápidos</h2>
        <button *ngFor="let u of quickUsers; let i = index" (click)="quickLogin(i)" [disabled]="loading()">
          {{ u.displayName }}
        </button>
      </div>

    </div>
  </section>

</main>
