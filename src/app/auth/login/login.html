<main class="main_bienvenida">
  <section class="access_section cliente">
    <h1>Iniciar Sesión</h1>

    <div class="login-container">
      <div class="login-buttons">

        <button (click)="goToQuienSoy()" class="btn-quien-soy">¿Quién soy?</button>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" [formControl]="f['email']" placeholder="Ingresa tu email">
            <div class="error" *ngIf="submitted && f['email'].errors">
              <small *ngIf="f['email'].errors?.['required']">El correo es obligatorio.</small>
              <small *ngIf="f['email'].errors?.['email']">Correo inválido.</small>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" [formControl]="f['password']" placeholder="Ingresa tu contraseña">
            <div class="error" *ngIf="submitted && f['password'].errors">
              <small *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</small>
              <small *ngIf="f['password'].errors?.['minlength']">Debe tener al menos 6 caracteres.</small>
            </div>
          </div>

          <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <button class="btn-register" (click)="goToRegister()">Registrarse</button>
      </div>

      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="quick-login" *ngIf="quickUsers.length > 0">
        <h2>Ingresos rápidos</h2>
        <button *ngFor="let u of quickUsers; let i = index" (click)="quickLogin(i)">
          {{ u.displayName }}
        </button>
      </div>

    </div>
  </section>
</main>
